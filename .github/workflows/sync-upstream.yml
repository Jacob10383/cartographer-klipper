name: Sync Upstream

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: k2
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Cartographer3D/cartographer-klipper.git 2>/dev/null || git remote set-url upstream https://github.com/Cartographer3D/cartographer-klipper.git
          git fetch upstream master

      - name: Merge upstream changes
        run: |
          # Attempt merge - will fail if conflicts exist
          git merge upstream/master --no-edit || {
            echo "Merge conflict detected! Manual intervention required."
            git merge --abort || true
            exit 1
          }

      - name: Push merge commit
        run: |
          git push origin k2

